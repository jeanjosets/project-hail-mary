<!-- Project Hail Mary — private journal, projects, media. Synced to Google Drive. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07100F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hail Mary" />
<meta name="description" content="Private journal, projects and media — synced to Google Drive" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Project Hail Mary</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap');
  :root{
    --bg:#07100F; --surface:#0E1A1A; --surface-2:#132726; --surface-3:#0B1716;
    --line:rgba(47,212,196,0.16); --line-soft:rgba(255,255,255,0.06);
    --text:#EAF2F1; --muted:#84A09D; --faint:#5E7977;
    --teal:#2FD4C4; --teal-deep:#0E7E78; --teal-blue:#2BA8C4;
    --orange:#E8893B; --orange-2:#F4B65C; --danger:#E26D7A;
    --font:'Nunito', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 80% -10%,rgba(43,168,196,.10),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(47,212,196,.08),transparent 55%),var(--bg);
    color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  #root{height:100vh}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:inherit}
  ::selection{background:rgba(47,212,196,.3)}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-track{background:transparent}
  .scroll::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:6px}
  .scroll::-webkit-scrollbar-thumb:hover{background:var(--faint)}
  .wcol::-webkit-scrollbar{width:0;display:none}
  * { scrollbar-width:thin; scrollbar-color:var(--surface-2) transparent }

  .fade{animation:fade .3s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .rise{animation:rise .28s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- shell (Mac: sidebar; mobile: bottom bar) ---- */
  .shell{display:flex;height:100vh;max-width:1180px;margin:0 auto}
  .nav{width:230px;flex:none;border-right:1px solid var(--line-soft);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,rgba(14,26,26,.45),rgba(11,23,22,.2))}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px;font-weight:800;font-size:19px}
  .brand .bg{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--surface-2),var(--surface-3));border:1px solid var(--line)}
  .navitem{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:var(--muted);font-weight:700;font-size:15px}
  .navitem:hover{background:var(--surface)}
  .navitem.on{background:rgba(47,212,196,.08);color:var(--teal)}
  .navspace{flex:1}
  .main{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto;padding:26px 30px 40px}
  .wrap{max-width:680px;margin:0 auto}
  .cards{display:grid;grid-template-columns:1fr;gap:11px}
  @media (max-width:820px){
    .shell{flex-direction:column;max-width:520px}
    .nav{width:auto;order:2;flex-direction:row;justify-content:space-around;border-right:none;border-top:1px solid var(--line-soft);
      padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(7,16,15,.9);backdrop-filter:blur(12px)}
    .brand{display:none}.navspace{display:none}
    .navitem{flex-direction:column;gap:4px;font-size:10px;padding:4px 8px}
    .navitem span.lbl{font-size:10px}
    .scroll{padding:18px 16px 30px}
  }

  /* ---- lock ---- */
  .lock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:28px}
  .glyph{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,var(--surface-2),var(--surface-3));border:1px solid var(--line);box-shadow:0 0 50px rgba(47,212,196,.14)}
  .lock h1{font-size:23px;font-weight:800;margin:0}.lock p{color:var(--muted);margin:0;font-size:14px;text-align:center}
  .dots{display:flex;gap:14px}.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--teal-deep);transition:.18s}
  .dot.on{background:var(--teal);border-color:var(--teal);box-shadow:0 0 14px rgba(47,212,196,.6)}
  .dot.err{border-color:var(--danger);background:var(--danger)}
  .pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px}
  .key{height:72px;border-radius:50%;font-size:25px;font-weight:600;background:var(--surface);border:1px solid var(--line-soft);transition:.12s;display:grid;place-items:center}
  .key:active{background:var(--surface-2);transform:scale(.94)}.key.fn{font-size:13px;color:var(--muted);background:transparent;border:none}
  .bio{display:flex;align-items:center;gap:9px;color:var(--teal);font-weight:700;font-size:15px;padding:12px 20px;border-radius:30px;border:1px solid var(--line);background:rgba(47,212,196,.05)}
  .shake{animation:shake .4s}@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-7px)}}

  h2.title{font-size:24px;font-weight:800;margin:0 0 2px}
  .subt{color:var(--muted);font-size:13.5px;margin:0 0 18px}

  /* ---- home ---- */
  .verse{background:linear-gradient(150deg,var(--surface-2),var(--surface-3));border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:14px;padding:14px 16px;font-style:italic;font-size:14.5px;line-height:1.55;color:#d7ece9}
  .verse b{display:block;font-style:normal;font-weight:700;color:var(--teal);font-size:12px;margin-top:7px;letter-spacing:.3px}
  .daybar{margin-top:14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(150deg,var(--surface-2),var(--surface-3));border:1px solid var(--line);border-radius:14px;padding:13px 16px}
  .daybar .lab{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
  .daybar .val{font-weight:800;font-size:20px;color:var(--teal)}
  .selline{text-align:center;font-weight:800;font-size:21px;margin:20px 0 10px;letter-spacing:.4px}
  .selline .y{color:var(--teal)} .selline .sep{color:var(--faint);margin:0 8px}
  .wheel{display:flex;gap:8px;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:16px;padding:6px;position:relative;overflow:hidden}
  .wheel::after{content:'';position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);height:42px;border-radius:11px;background:rgba(47,212,196,.06);border:1px solid var(--line);pointer-events:none}
  .wcol{flex:1;height:176px;overflow-y:auto;text-align:center;scrollbar-width:none;-ms-overflow-style:none}
  .wcol.mon{flex:1.5}
  .wpad{padding:67px 0}
  .witem{padding:9px 4px;font-size:16px;color:var(--muted);position:relative;border-radius:9px;text-align:center}
  .witem.sel{color:var(--teal);font-weight:800}
  /* Days with entries: bright white text + left teal border strip */
  .witem.has-entry{color:#EAF2F1;font-weight:700;border-left:3px solid var(--teal);padding-left:6px}
  .witem.sel.has-entry{color:var(--teal);font-weight:800;border-left:3px solid var(--teal)}
  .witem .edot{display:none}
  .openday{width:100%;margin-top:12px;padding:14px;border-radius:14px;font-weight:800;background:linear-gradient(150deg,var(--teal),var(--teal-deep));color:#04201d;display:flex;align-items:center;justify-content:center;gap:8px}
  .preview{margin-top:14px;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:14px;padding:15px 16px;line-height:1.65;color:#cfe6e3;font-size:14.5px}
  .preview .pd{color:var(--teal);font-weight:700;font-size:12px;margin-bottom:7px;letter-spacing:.3px}
  .preview .empty{color:var(--faint);font-style:italic}

  .sech{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
  .sech .t{font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase}
  .sech button{color:var(--teal);font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:9px}
  .sech button:hover{background:var(--surface)}

  .gcard{background:var(--surface-3);border:1px solid var(--line-soft);border-radius:16px;padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.12s}
  .gcard:hover{border-color:var(--line)}
  .gcard .gt{font-weight:800;font-size:16px}
  .gcard .gm{display:flex;gap:9px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .catchip{font-size:11px;font-weight:700;color:var(--teal-blue);border:1px solid rgba(43,168,196,.4);padding:2px 9px;border-radius:20px}
  .ongoing{color:var(--teal);font-weight:700;font-size:12.5px}
  .donelab{color:var(--teal-blue);font-weight:700;font-size:12.5px}
  .subtiny{color:var(--muted);font-size:12px}
  .gbar{height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:12px}
  .gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-2));border-radius:6px;transition:width .5s}
  .gbar-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--orange-2);font-weight:700;margin-top:5px}
  .empty-hint{color:var(--faint);font-size:13.5px;line-height:1.6;background:var(--surface-3);border:1px dashed var(--line-soft);border-radius:14px;padding:18px}

  /* segmented */
  .seg{display:flex;gap:6px;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
  .seg button.on{background:rgba(47,212,196,.1);color:var(--teal)}

  /* ---- media ---- */
  .player{background:linear-gradient(150deg,var(--surface-2),var(--surface-3));border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
  .player .pn{font-weight:800;font-size:17px}
  .player .pt{color:var(--muted);font-size:12.5px;margin-top:2px}
  .pbarwrap{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:14px 0 6px}
  .pbarwrap i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-blue))}
  .ptimes{display:flex;justify-content:space-between;color:var(--faint);font-size:11px}
  .pctrls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px}
  .pbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line-soft)}
  .pbtn.on{color:var(--teal);border-color:var(--line);background:rgba(47,212,196,.06)}
  .pbtn.big{width:60px;height:60px;background:linear-gradient(150deg,var(--teal),var(--teal-deep));color:#04201d;border:none}
  .pcount{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .pcount .num{font-weight:800;font-size:26px;color:var(--teal)}
  .pcount .lab{color:var(--muted);font-size:12px}
  .trow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:13px;margin-bottom:9px;cursor:pointer}
  .trow.on{border-color:var(--line)}
  .trow .ti{flex:1}.trow .ti b{font-weight:700}.trow .ti span{display:block;color:var(--faint);font-size:12px}
  .trow .cnt{font-weight:800;color:var(--teal)}
  .counter{background:var(--surface-3);border:1px solid var(--line-soft);border-radius:16px;padding:16px;margin-bottom:11px;text-align:center}
  .counter .cn{font-weight:800;font-size:16px}
  .counter .cnum{font-weight:800;font-size:44px;color:var(--teal);margin:6px 0}
  .tapbtn{width:100%;padding:15px;border-radius:13px;font-weight:800;font-size:16px;background:linear-gradient(150deg,var(--teal),var(--teal-deep));color:#04201d;display:flex;align-items:center;justify-content:center;gap:8px}
  .tapbtn:active{transform:scale(.98)}
  .crow{display:flex;gap:10px;margin-top:10px}
  .crow button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--muted);border:1px solid var(--line-soft)}

  /* ---- calendar grid (menu) ---- */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .top .mo{font-size:18px;font-weight:800}.top .yr{color:var(--teal)}
  .icbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}.icbtn:hover{background:var(--surface)}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);margin:4px 0 6px}.dow span{text-align:center;font-size:11px;font-weight:700;color:var(--faint)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cell{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-3);border:1px solid var(--line-soft);font-weight:600;position:relative}
  .cell.empty{background:transparent;border:none}.cell:hover{border-color:var(--line)}
  .cell.has{background:linear-gradient(160deg,#0c2b29,#0a201f);border:1px solid rgba(47,212,196,.45)}.cell.has .n{color:#CFF7F1}
  .cell.today{outline:2px solid var(--teal-blue);outline-offset:-2px}
  .cell .n{font-size:14px}

  /* ---- sheets / modals ---- */
  .scrim{position:absolute;inset:0;background:rgba(2,8,8,.66);backdrop-filter:blur(2px);z-index:20}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 22px 30px;max-height:88%;overflow-y:auto}
  @media(min-width:821px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:600px;border-radius:20px;border:1px solid var(--line);max-height:88%;animation:riseC .28s cubic-bezier(.2,.8,.2,1) both}}
  @keyframes riseC{from{opacity:0;transform:translate(-50%,calc(-50% + 18px))}to{opacity:1;transform:translate(-50%,-50%)}}
  .grip{width:40px;height:4px;border-radius:3px;background:#2c4543;margin:6px auto 14px}
  @media(min-width:821px){.grip{display:none}}
  .sheet h2{margin:2px 0;font-size:20px;font-weight:800}.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .modal{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 8px}
  .mtop .d{font-weight:800;font-size:17px}
  .mbody{flex:1;overflow-y:auto;padding:0 22px 30px}.mbody .wrap{max-width:680px;margin:0 auto}

  .field{margin-top:14px}
  .field label{display:block;font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:11px;color:var(--text);font-size:15.5px;padding:11px 12px;outline:none}
  .field input:focus,.field textarea:focus{border-color:var(--teal)}
  .row2{display:flex;gap:12px}.row2>*{flex:1}
  .cats{display:flex;gap:7px;flex-wrap:wrap}
  .cat{padding:7px 12px;border-radius:30px;background:var(--surface-3);border:1px solid var(--line-soft);font-size:13px;font-weight:700;color:var(--muted)}
  .cat.sel{background:rgba(47,212,196,.08);border-color:var(--teal);color:var(--teal)}
  .btnp{width:100%;margin-top:20px;padding:14px;border-radius:13px;font-weight:800;background:linear-gradient(150deg,var(--teal),var(--teal-deep));color:#04201d;display:flex;align-items:center;justify-content:center;gap:8px}
  .btng{width:100%;margin-top:10px;padding:13px;border-radius:13px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
  .btnd{color:var(--danger);font-weight:700;font-size:13px;margin-top:16px;text-align:center;width:100%;padding:8px}

  .sub-item{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:11px;margin-top:8px}
  .ckbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--teal-deep);display:grid;place-items:center;flex:none;color:#04201d}
  .ckbox.on{background:var(--teal);border-color:var(--teal)}
  .sub-item.done .stxt{text-decoration:line-through;color:var(--faint)}
  .sub-item .stxt{flex:1;font-size:14.5px}
  .del{color:var(--faint);font-size:18px;padding:2px 6px}
  .update{background:var(--surface-3);border-left:2px solid var(--teal);border-radius:0 11px 11px 0;padding:10px 13px;margin-top:8px}
  .update .ut{font-size:11px;color:var(--teal);font-weight:700;margin-bottom:3px}.update .ux{font-size:14px;line-height:1.5;color:#cfe6e3}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .fchip{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:11px;font-size:13px;font-weight:600}
  .fchip .fk{color:var(--teal)}
  .rng{width:100%}
  .infoline{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line-soft);font-size:14px}
  .infoline:first-child{border-top:none}.infoline .k{color:var(--muted)}

  .menucard{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:14px;margin-bottom:10px;width:100%;text-align:left}
  .menucard:hover{border-color:var(--line)}
  .menucard .mt2{font-weight:700}.menucard .ms2{color:var(--muted);font-size:12.5px;margin-top:2px}
  .tree{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;color:var(--muted);background:var(--surface-3);border:1px solid var(--line-soft);border-radius:12px;padding:14px;white-space:pre;overflow-x:auto}
  .tree b{color:var(--teal)} .tree em{color:var(--orange-2);font-style:normal}
  .drivestat{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:13px;margin-bottom:14px;font-size:13.5px}
  .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;background:rgba(232,137,59,.15);color:var(--orange-2);border:1px solid rgba(232,137,59,.3)}

  /* editor */
  .ed{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
  .edtop{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
  .edtop .d{font-weight:800;font-size:17px}
  .edtop .save{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}.edtop .save.go{color:var(--teal)}
  .svdot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .edmeta{padding:0 24px 6px;color:var(--faint);font-size:12px;display:flex;gap:14px}
  textarea.paper{flex:1;width:100%;max-width:760px;margin:0 auto;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-size:18px;line-height:1.8;padding:8px 24px 10px}
  textarea.paper::placeholder{color:#3f5957}
  .suggest{display:flex;gap:8px;padding:10px 22px;border-top:1px solid var(--line-soft);background:rgba(14,26,26,.7);overflow-x:auto;min-height:18px}
  .chip{flex:none;padding:8px 15px;border-radius:30px;background:var(--surface-2);border:1px solid var(--line);color:var(--teal);font-weight:700;font-size:14px}
  .edbar{display:flex;justify-content:space-between;padding:10px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft)}
  .smallbtn{padding:9px 14px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted);border:1px solid var(--line-soft)}.smallbtn.t{color:var(--teal);border-color:var(--line)}
  .searchbox{display:flex;align-items:center;gap:10px;background:var(--surface-3);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:14px}
  .searchbox input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15.5px}

/* ===== GOOGLE DRIVE — ISOLATED SAFE LAYER =====
   The app ALWAYS works from local memory (mem{}).
   Drive is an optional background sync — any Drive error is logged
   silently and NEVER crashes or locks the app.
   ================================================ */
var CLIENT_ID='651548279771-86rvs7k45o763e67vd54gsij4q5e17eq.apps.googleusercontent.com';
var SCOPE='https://www.googleapis.com/auth/drive';

/* state */
var _token=null, _tokenExpiry=0, _tokenClient=null;
var _tokenRefreshing=false, _tokenResolvers=[];
var _rootId=null, _driveReady=false, _authInProgress=false;
var mem={};   /* always-available local cache — the app's source of truth */

/* ---- GIS setup (called once after GIS script loads) ---- */
function setupGIS(){
  if(typeof google==='undefined'||!google.accounts) return;
  try{
    _tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID, scope:SCOPE,
      callback:function(resp){
        if(resp&&resp.access_token){
          _token=resp.access_token;
          _tokenExpiry=Date.now()+(resp.expires_in||3599)*1000;
          _tokenRefreshing=false;
          var _rs=_tokenResolvers.splice(0); _rs.forEach(function(r){r(_token);});
          _afterSignIn();
        } else {
          _driveErr('Token response had no access_token: '+(resp&&resp.error||'unknown'));
        }
      },
      error_callback:function(e){_driveErr('GIS error: '+JSON.stringify(e));}
    });
  } catch(e){ _driveErr('initTokenClient failed: '+e.message); }
}
window._gisLoaded=function(){ setupGIS(); };

/* Returns a Promise<token|null>. Silently refreshes if missing/expired. */
function _ensureToken(){
  if(_token&&_tokenExpiry>Date.now()+10000) return Promise.resolve(_token);
  if(!_tokenClient) return Promise.resolve(null);
  return new Promise(function(resolve){
    _tokenResolvers.push(resolve);
    if(!_tokenRefreshing){
      _tokenRefreshing=true;
      try{_tokenClient.requestAccessToken({prompt:''});}
      catch(e){_tokenRefreshing=false;_tokenResolvers.splice(_tokenResolvers.indexOf(resolve),1);resolve(null);}
    }
  });
}

/* Fetch audio bytes from Drive with auth. Verifies response is audio, not a JSON error.
   Retries once after a silent token refresh if the first attempt returns 401 or JSON. */
function _fetchMediaBlob(driveId){
  console.log('[_fetchMediaBlob] driveId='+driveId);
  function attempt(tok){
    if(!tok) return Promise.resolve(null);
    return fetch('https://www.googleapis.com/drive/v3/files/'+driveId+'?fields=id,name,mimeType,size',
      {headers:{Authorization:'Bearer '+tok}})
      .then(function(r){
        if(r.status===401||r.status===403){_token=null;_tokenExpiry=0;return null;}
        return r.ok?r.json():null;
      })
      .then(function(info){
        if(!info){console.warn('[_fetchMediaBlob] metadata fetch failed for driveId='+driveId);return null;}
        console.log('[_fetchMediaBlob] metadata:',JSON.stringify(info));
        var streamUrl='https://drive.usercontent.google.com/download?id='+driveId+'&export=open&authuser=0';
        return {streamUrl:streamUrl,mimeType:info.mimeType||'audio/mpeg',name:info.name||''};
      });
  }
  return _ensureToken().then(function(tok){
    return attempt(tok).then(function(result){
      if(result) return result;
      _token=null; _tokenExpiry=0;
      return _ensureToken().then(function(tok2){ return attempt(tok2); });
    });
  }).catch(function(e){console.warn('[_fetchMediaBlob] caught:',e);return null;});
}

/* ---- public: user clicks "Connect" button ---- */
function connectDrive(){
  if(!_tokenClient){ _driveErr('Google sign-in library not loaded yet. Wait 2 seconds and try again.'); return; }
  try{ _tokenClient.requestAccessToken({prompt:'consent'}); }
  catch(e){ _driveErr('requestAccessToken threw: '+e.message); }
}

/* ---- called after we have a token ---- */
function _afterSignIn(){
  _authInProgress=true;
  _driveSetStatus('connecting');
  _ensureFolder('Project Hail Mary',null).then(function(rootId){
    _rootId=rootId;
    return Promise.all([
      _ensureFolder('journal',rootId),
      _ensureFolder('projects',rootId),
      _ensureFolder('media',rootId)
    ]);
  }).then(function(){
    _driveReady=true;
    _driveSetStatus('live');
    _flushPending();
    return Promise.all([buildEntryIndex(), store.loadProjects(), store.loadMedia(), store.loadSettings()]);
  }).then(function(results){
    if(results[1]) mem.projects=results[1];
    if(results[2]) mem.media=results[2];
    if(results[3]) mem.settings=results[3];
    _authInProgress=false;
    refresh();
    _preloadLocalAudio();
    if(!S.locked) renderShell();
    _syncMediaCounts();
  }).catch(function(e){ _authInProgress=false; _driveErr('Setup failed: '+e.message); });
}

function buildEntryIndex(){
  var all=[];
  function page(pt){
    var url='/drive/v3/files?spaces=drive&fields=files(id,name)&pageSize=1000'
      +'&q='+encodeURIComponent("trashed=false and name contains '.docx'")
      +(pt?'&pageToken='+pt:'');
    return _djson('GET',url).then(function(r){
      if(!r)return;
      (r.files||[]).forEach(function(f){
        if(/^\d{8}\.docx$/i.test(f.name))all.push({dk:f.name.slice(0,8),id:f.id});
      });
      if(r.nextPageToken)return page(r.nextPageToken);
    });
  }
  return page(null).then(function(){
    var idx={};
    all.forEach(function(f){idx[f.dk]=f.id;});
    S.entryIndex=idx;
    try{localStorage.setItem('phm-entry-index',JSON.stringify({index:idx,updated:Date.now()}));}catch(e){}
    console.log('[PHM] index built:',Object.keys(idx).length,'entries');
    refresh();if(!S.locked)renderShell();
  }).catch(function(e){console.warn('[PHM] index failed:',e);});
}

/* ---- raw Drive fetch (never throws — returns null on error) ---- */
function _df(method,path,body,ct){
  if(!_token) return Promise.resolve(null);
  var headers={Authorization:'Bearer '+_token};
  if(ct) headers['Content-Type']=ct;
  return fetch('https://www.googleapis.com'+path,{method:method,headers:headers,body:body})
    .then(function(r){
      if(r.status===204) return r;   /* DELETE returns no content */
      if(r.status===401){_token=null;_driveReady=false;_driveSetStatus('error','Session expired — reconnect');return null;}
      if(!r.ok) return r.text().then(function(t){console.warn('[Drive]',method,path,r.status,t);return null;});
      return r;
    }).catch(function(e){console.warn('[Drive fetch]',e.message);return null;});
}
function _djson(method,path,body){
  return _df(method,path,body?JSON.stringify(body):undefined,body?'application/json':undefined)
    .then(function(r){return r?r.json():null;});
}

    .then(function(r){
      if(r&&r.files&&r.files[0]){_fc[k]=r.files[0].id;return r.files[0].id;}
      var meta={name:name,mimeType:'application/vnd.google-apps.folder'};
      if(parentId)meta.parents=[parentId];
      return _djson('POST','/drive/v3/files?fields=id',meta).then(function(r2){if(r2){_fc[k]=r2.id;return r2.id;}return null;});
    });
}

/* ---- file helpers ---- */
function _findFile(name,folderId){

function _writeFile(name,folderId,content,mimeType){

function _readText(fileId){

/* Read a .docx file from Drive and extract plain text.
   Downloads the raw binary then decompresses word/document.xml */
function _readDocxAsText(fileId){
  return _df('GET','/drive/v3/files/'+fileId+'?alt=media')
    .then(function(r){ return r?r.arrayBuffer():null; })
    .then(function(ab){

    }).catch(function(e){
      console.warn('[_readDocxAsText]',e);
      return null;
    });
}

/* Parse a .docx ArrayBuffer — walks the zip, decompresses word/document.xml,
   strips XML tags, returns plain text */
async function _parseDocx(ab){
  try{
    var u8=new Uint8Array(ab);
    /* Scan zip local file entries */
    var i=0;
    while(i<u8.length-30){
      /* PK\x03\x04 = local file header */
      if(u8[i]!==0x50||u8[i+1]!==0x4B||u8[i+2]!==0x03||u8[i+3]!==0x04){i++;continue;}
      var flags   =(u8[i+6])|(u8[i+7]<<8);
      var method  =(u8[i+8])|(u8[i+9]<<8);
      var csize32 =(u8[i+18])|(u8[i+19]<<8)|(u8[i+20]<<16)|((u8[i+21]&0x7f)<<24);
      var nlen    =(u8[i+26])|(u8[i+27]<<8);
      var xlen    =(u8[i+28])|(u8[i+29]<<8);
      var nameStr =new TextDecoder('utf-8',{fatal:false}).decode(u8.slice(i+30,i+30+nlen));
      var dstart  =i+30+nlen+xlen;

      /* handle data descriptor (bit 3 of flags): sizes may be 0 in header */
      var csize=csize32;
      if((flags&8)&&csize===0){
        /* scan forward for PK\x07\x08 data descriptor or next PK\x03\x04 */
        var j=dstart;
        while(j<u8.length-4){
          if((u8[j]===0x50&&u8[j+1]===0x4B&&u8[j+2]===0x07&&u8[j+3]===0x08)||
             (u8[j]===0x50&&u8[j+1]===0x4B&&u8[j+2]===0x03&&u8[j+3]===0x04)){
            csize=j-dstart; break;
          }
          j++;
        }
      }

      if(nameStr==='word/document.xml'){
        var data=u8.slice(dstart,dstart+csize);
        var xml='';
        if(method===0){
          /* stored — no compression */
          xml=new TextDecoder('utf-8',{fatal:false}).decode(data);
        } else if(method===8){
          /* deflate */
          if(typeof DecompressionStream!=='undefined'){
            var ds=new DecompressionStream('deflate-raw');
            var w=ds.writable.getWriter();
            var r=ds.readable.getReader();
            w.write(data); w.close();
            var parts=[],tot=0;
            while(true){var ch=await r.read();if(ch.done)break;parts.push(ch.value);tot+=ch.value.length;}
            var out=new Uint8Array(tot),off=0;
            parts.forEach(function(p){out.set(p,off);off+=p.length;});
            xml=new TextDecoder('utf-8',{fatal:false}).decode(out);
          }
        }
        if(xml&&xml.indexOf('<w:')>=0){
          return xml
            .replace(/<w:br[^>]*\/>/g,'\n')
            .replace(/<w:cr\/>/g,'\n')
            .replace(/<\/w:p>/g,'\n')
            .replace(/<[^>]+>/g,'')
            .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
            .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ')
            .replace(/\n{3,}/g,'\n\n').trim();
        }
      }
      i=dstart+Math.max(csize,1);
    }
  }catch(e){ console.warn('[_parseDocx]',e.message); }
  return null;
}
function _listFiles(folderId){

function _writeBinary(name,folderId,bytes,mimeType){
  /* multipart upload with binary body */
  return _findFile(name,folderId).then(function(existId){
    var b='phm'+Date.now();
    var metaObj=existId?{mimeType:mimeType}:{name:name,mimeType:mimeType,parents:[folderId]};
    var metaStr=JSON.stringify(metaObj);
    var metaPart='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+metaStr+'\r\n--'+b+'\r\nContent-Type: '+mimeType+'\r\n\r\n';
    var endPart='\r\n--'+b+'--';
    var metaBytes=_strToU8(metaPart);
    var endBytes=_strToU8(endPart);
    var body=_concat([metaBytes,bytes,endBytes]);
    var url=existId?'/upload/drive/v3/files/'+existId+'?uploadType=multipart&fields=id'
                   :'/upload/drive/v3/files?uploadType=multipart&fields=id';
    return _df(existId?'PATCH':'POST',url,body,'multipart/related; boundary='+b)
      .then(function(r){return r?r.json():null;});
  });
}

/* ---- pending flush queue ---- */

/* ---- robust HTML → plain text (handles all legacy .html entries) ---- */
function _stripHtml(html){
  var s=html
    .replace(/<\/p>/gi,'\n').replace(/<\/div>/gi,'\n').replace(/<\/h[1-6]>/gi,'\n')
    .replace(/<br\s*\/?>/gi,'\n').replace(/<\/li>/gi,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
  return s;
}
/* Remove repeated date lines that appear at the top of legacy HTML entries */
function _cleanEntryText(text){
  if(!text)return text;
  /* remove lines that look like "Day, DD Month YYYY" or "=== Date ===" at the top */
  var dateRx=/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+\d+\s+\w+\s+\d{4}\s*$/;
  var lines=text.split('\n');
  /* strip leading lines that are just dates or empty */
  while(lines.length&&(lines[0].trim()===''||dateRx.test(lines[0].trim())||/^=+/.test(lines[0].trim()))){
    lines.shift();
  }
  return lines.join('\n').trim();
}

/* ===== DOCX GENERATION =====
   Generates a real .docx (Office Open XML) file in the browser.
   No library needed — .docx is just a zip of XML files.
   We use a minimal but fully valid structure that Word, Pages,
   and Google Docs all open correctly.
   ============================================= */
function _makeDocx(title, bodyText){
  /* Word XML pieces */
  var paras = bodyText.split('\n').map(function(line){
    return '<w:p><w:r><w:t xml:space="preserve">'+_xmlEsc(line)+'</w:t></w:r></w:p>';
  }).join('');

  var docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    +'<w:body>'
    +'<w:p><w:pPr><w:pStyle w:val="Heading1"/></w:pPr><w:r><w:t>'+_xmlEsc(title)+'</w:t></w:r></w:p>'
    + paras

/* ---- minimal zip builder (no dependencies) ---- */
function _MiniZip(){
  this.files=[];
  this.add=function(name,content){
    var data=_strToU8(content);
    this.files.push({name:name,data:data});
  };
  this.build=function(){
    var parts=[], centralDir=[], offset=0;
    this.files.forEach(function(f){
      var nameBytes=_strToU8(f.name);
      var crc=_crc32(f.data);
      /* local file header */
      var lh=new Uint8Array(30+nameBytes.length);
      var dv=new DataView(lh.buffer);
      dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true);
      dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
      dv.setUint32(14,crc,true); dv.setUint32(18,f.data.length,true); dv.setUint32(22,f.data.length,true);
      dv.setUint16(26,nameBytes.length,true); dv.setUint16(28,0,true);
      lh.set(nameBytes,30);
      /* central dir entry */
      var cd=new Uint8Array(46+nameBytes.length);
      var cdv=new DataView(cd.buffer);
      cdv.setUint32(0,0x02014b50,true); cdv.setUint16(4,20,true); cdv.setUint16(6,20,true);
      cdv.setUint16(8,0,true); cdv.setUint16(10,0,true); cdv.setUint16(12,0,true); cdv.setUint16(14,0,true);
      cdv.setUint32(16,crc,true); cdv.setUint32(20,f.data.length,true); cdv.setUint32(24,f.data.length,true);
      cdv.setUint16(28,nameBytes.length,true); cdv.setUint16(30,0,true); cdv.setUint16(32,0,true);
      cdv.setUint16(34,0,true); cdv.setUint16(36,0,true); cdv.setUint32(38,0,true);
      cdv.setUint32(42,offset,true); cd.set(nameBytes,46);
      parts.push(lh,f.data); centralDir.push(cd);
      offset+=lh.length+f.data.length;
    });
    var cdBytes=_concat(centralDir);
    var eocd=new Uint8Array(22); var edv=new DataView(eocd.buffer);
    edv.setUint32(0,0x06054b50,true); edv.setUint16(4,0,true); edv.setUint16(6,0,true);
    edv.setUint16(8,this.files.length,true); edv.setUint16(10,this.files.length,true);
    edv.setUint32(12,cdBytes.length,true); edv.setUint32(16,offset,true); edv.setUint16(20,0,true);
    return _concat(parts.concat([cdBytes,eocd]));
  };
}
function _strToU8(s){ var a=new TextEncoder().encode(s); return a; }
function _concat(arrs){ var tot=arrs.reduce(function(n,a){return n+a.length;},0); var r=new Uint8Array(tot); var p=0; arrs.forEach(function(a){r.set(a,p);p+=a.length;}); return r; }
function _crc32(data){
  var t=[]; for(var i=0;i<256;i++){var c=i;for(var j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c;}
  var crc=0xFFFFFFFF;
  for(var k=0;k<data.length;k++)crc=t[(crc^data[k])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}

async function _docxToText(arrayBuffer){
  try{
    var bytes=new Uint8Array(arrayBuffer);
    console.log('[docxToText] file size:',bytes.length,'bytes');

    /* Strategy 1: walk zip headers looking for word/document.xml */
    var i=0;
    while(i<bytes.length-30){
      if(bytes[i]!==0x50||bytes[i+1]!==0x4B||bytes[i+2]!==0x03||bytes[i+3]!==0x04){i++;continue;}
      var compMethod=(bytes[i+8])|(bytes[i+9]<<8);
      var compSize  =(bytes[i+18])|(bytes[i+19]<<8)|(bytes[i+20]<<16)|(bytes[i+21]<<24);
      var nameLen   =(bytes[i+26])|(bytes[i+27]<<8);
      var extraLen  =(bytes[i+28])|(bytes[i+29]<<8);
      var nameBytes =bytes.slice(i+30,i+30+nameLen);
      var name      =new TextDecoder('utf-8',{fatal:false}).decode(nameBytes);
      var dataStart =i+30+nameLen+extraLen;
      if(dataStart+compSize>bytes.length){i++;continue;}
      var data=bytes.slice(dataStart,dataStart+compSize);
      console.log('[docxToText] entry:',name,'method:',compMethod,'compSize:',compSize);

      if(name==='word/document.xml'){
        var xml='';
        if(compMethod===0){
          xml=new TextDecoder('utf-8',{fatal:false}).decode(data);
          console.log('[docxToText] stored (uncompressed), xml length:',xml.length);
        } else if(compMethod===8){
          /* deflate — try DecompressionStream first */
          if(typeof DecompressionStream!=='undefined'){
            try{
              var ds=new DecompressionStream('deflate-raw');
              var writer=ds.writable.getWriter();
              var reader=ds.readable.getReader();
              writer.write(data); writer.close();
              var chunks=[],total=0;
              while(true){var r2=await reader.read();if(r2.done)break;chunks.push(r2.value);total+=r2.value.length;}
              var out=new Uint8Array(total); var off=0;
              chunks.forEach(function(c){out.set(c,off);off+=c.length;});
              xml=new TextDecoder('utf-8',{fatal:false}).decode(out);
              console.log('[docxToText] deflate-raw ok, xml length:',xml.length);
            }catch(de){
              console.warn('[docxToText] deflate-raw failed:',de.message,', trying raw decode');
              xml=new TextDecoder('utf-8',{fatal:false}).decode(data);
            }
          } else {
            console.warn('[docxToText] DecompressionStream not available, trying raw decode');
            xml=new TextDecoder('utf-8',{fatal:false}).decode(data);
          }
        }

        if(xml&&xml.includes('<w:')){
          var text=xml
            .replace(/<w:br[^>]*\/>/g,'\n')
            .replace(/<\/w:p>/g,'\n')
            .replace(/<[^>]+>/g,'')
            .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
            .replace(/\n{3,}/g,'\n\n').trim();
          console.log('[docxToText] extracted',text.length,'chars,',text.split(/\s+/).length,'words');
          return text;
        }
        /* xml exists but doesn't look like Word XML — try raw scan below */
        console.warn('[docxToText] xml doesnt contain w: namespace, len=',xml.length);
        break;
      }
      i=dataStart+Math.max(1,compSize);
    }

    /* Strategy 2: raw text scan — extract any readable text from the binary */
    console.warn('[docxToText] falling back to raw text extraction');
    var raw=new TextDecoder('utf-8',{fatal:false}).decode(bytes);
    /* grab content between XML tags if any w:t elements exist */
    var wt=raw.match(/<w:t[^>]*>([^<]+)<\/w:t>/g);
    if(wt&&wt.length){
      var text2=wt.map(function(m){return m.replace(/<[^>]+>/g,'');}).join(' ').trim();
      if(text2.length>10){console.log('[docxToText] raw w:t scan got',text2.length,'chars');return text2;}
    }

  }catch(e){ console.warn('[docxToText] exception:',e.message||e); }
  console.warn('[docxToText] returning empty string');
  return '';
}

   PUBLIC STORE API — used everywhere in the app
   Always updates mem{} immediately (instant UI),

var store={
  /* JOURNAL */
  saveEntry:function(dk,text){
    if(text&&text.trim())mem['e:'+dk]={text:text,ts:Date.now()};else delete mem['e:'+dk];
    _whenReady(function(){
      _ensurePath(_journalFolderParts(dk)).then(function(fid){
        if(!fid)return;
        if(!text||!text.trim()){
          _deleteFile(dk+'.docx',fid);
          _deleteFile(dk+'.html',fid);
          return;
        }
        /* delete legacy .html if it exists, then save as .docx */
        _deleteFile(dk+'.html',fid);
        return _writeBinary(dk+'.docx',fid,_makeDocx(fmtLong(dk),text),'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      }).catch(function(e){console.warn('[Drive saveEntry]',e);});
    });
    return Promise.resolve();
  },

  loadEntries:function(){
    if(!_driveReady)return Promise.resolve();
    /* single search query: find ALL yyyymmdd.docx or .html files anywhere
       under the "Project Hail Mary" root — no tree walk needed */
    var q="(name contains '.docx' or name contains '.html') and trashed=false and '"+_rootId+"' in parents";
    /* that only searches direct children — use a recursive search instead */
    /* search across ALL of Drive for files matching our pattern inside our root */
    var searchQ="mimeType!='application/vnd.google-apps.folder' and trashed=false and name contains '2'";
    /* Better: search specifically for 8-digit named files under any folder we own */
    /* Most reliable: just list ALL files in drive and filter by name pattern */
    var fetchPage=function(pageToken,allFiles){
      allFiles=allFiles||[];
      var url='/drive/v3/files?spaces=drive&fields=files(id,name,mimeType)&pageSize=1000'
        +'&q='+encodeURIComponent("trashed=false and (name contains '.docx' or name contains '.html')")
        +(pageToken?'&pageToken='+pageToken:'');
      return _djson('GET',url).then(function(r){
        if(!r)return allFiles;
        var matched=(r.files||[]).filter(function(f){return /^\d{8}\.(docx|html)$/i.test(f.name);});
        allFiles=allFiles.concat(matched);
        if(r.nextPageToken)return fetchPage(r.nextPageToken,allFiles);
        return allFiles;
      });
    };
    return fetchPage(null,[]).then(function(allFiles){
      /* deduplicate by date — prefer .docx over .html */
      var byDate={};
      allFiles.forEach(function(f){
        var m2=f.name.match(/^(\d{8})\.(docx|html)$/i);
        if(!m2)return;
        var dk=m2[1],ext=m2[2].toLowerCase();
        if(!byDate[dk]||ext==='docx')byDate[dk]=f;
      });
      var keys=Object.keys(byDate).filter(function(dk){return !mem['e:'+dk];});
      console.log('[Drive loadEntries] found',Object.keys(byDate).length,'dated files,',keys.length,'to fetch');
      /* fetch in batches of 5 to avoid ERR_INSUFFICIENT_RESOURCES */
      var BATCH=5; var i=0;
      function nextBatch(){
        if(i>=keys.length)return Promise.resolve();
        var batch=keys.slice(i,i+BATCH); i+=BATCH;
        return Promise.all(batch.map(function(dk){
          var f=byDate[dk];
          var isDocx=/\.docx$/i.test(f.name);
          var reader=isDocx?_readDocxAsText(f.id):_readText(f.id);
          return reader.then(function(text){
            if(!text)return;
            var clean=_cleanEntryText(isDocx?text.trim():_stripHtml(text));
            if(clean){mem['e:'+dk]={text:clean,ts:Date.now()};console.log('[Drive] loaded',dk);}
          }).catch(function(e){console.warn('[Drive] failed',dk,e.message);});
        })).then(nextBatch);
      }
      return nextBatch();
    }).catch(function(e){console.warn('[Drive loadEntries]',e);});
  },

  /* PROJECTS */
  saveProjects:function(obj){
    mem.projects=obj;
    _whenReady(function(){
      _ensureFolder('projects',_rootId).then(function(pid){
        return _writeFile('phm-projects.json',pid,JSON.stringify(obj,null,2));
      }).catch(function(e){console.warn('[Drive saveProjects]',e);});
    });
    return Promise.resolve();
  },
  loadProjects:function(){
    if(!_driveReady)return Promise.resolve(mem.projects||{});
    return _ensureFolder('projects',_rootId).then(function(pid){
      return _findFile('phm-projects.json',pid).then(function(id){
        if(!id)return mem.projects||{};
        return _readText(id).then(function(t){if(t)try{mem.projects=JSON.parse(t);}catch(e){}return mem.projects||{};});
      });
    }).catch(function(e){console.warn('[Drive loadProjects]',e);return mem.projects||{};});
  },

  /* MEDIA + COUNTERS */
  saveMedia:function(tracks,counters){
    var counts=(mem.media&&mem.media.counts)||{};
    mem.media={tracks:tracks,counters:counters,counts:counts};
    _whenReady(function(){
      _ensureFolder('media',_rootId).then(function(mid){
        return _writeFile('phm-media.json',mid,JSON.stringify(mem.media,null,2));
      }).catch(function(e){console.warn('[Drive saveMedia]',e);});
    });
    return Promise.resolve();
  },
  loadMedia:function(){
    if(!_driveReady)return Promise.resolve(mem.media||{});
    return _ensureFolder('media',_rootId).then(function(mid){
      /* load saved counts from phm-media.json */
      return _findFile('phm-media.json',mid).then(function(id){
        if(id)return _readText(id).then(function(t){
          if(t)try{
            var d=JSON.parse(t); mem.media=d;
            /* merge cross-device play counts (keyed by trackId) into track autoCount */
            var cnts=(d&&d.counts)||{};
            Object.keys((d&&d.tracks)||{}).forEach(function(tid){
              if(cnts[tid]!==undefined) d.tracks[tid].autoCount=Math.max(d.tracks[tid].autoCount||0,cnts[tid]);
            });
          }catch(e){}
        });
      }).then(function(){
        /* scan media folder for audio files — add any not already tracked */
        return _listFiles(mid).then(function(files){
          var audio=files.filter(function(f){return /\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name);});
          if(!audio.length)return;
          var existing=mem.media&&mem.media.tracks?mem.media.tracks:{};
          /* build a name→trackId map so we can update existing entries */
          var nameToId={};
          Object.keys(existing).forEach(function(id){nameToId[existing[id].name]=id;});
          var changed=false;
          audio.forEach(function(f){
            var existingId=nameToId[f.name];
            if(existingId){
              /* track with this name exists — assign driveId if missing */
              if(!existing[existingId].driveId){
                existing[existingId].driveId=f.id;
                changed=true;
                console.log('[Media] assigned driveId to existing track:',f.name);
              }
              /* else: already has a driveId — true duplicate, skip */
            } else {
              /* new track not seen before */
              var id=uid('t');
              existing[id]={id:id,name:f.name,driveId:f.id,duration:600,autoCount:0};
              nameToId[f.name]=id;
              changed=true;
              console.log('[Media] found new track:',f.name);
            }
          });
          if(changed){
            if(!mem.media)mem.media={tracks:{},counters:{}};
            mem.media.tracks=existing;
          }
        });
      }).then(function(){return mem.media||{};});
    }).catch(function(e){console.warn('[Drive loadMedia]',e);return mem.media||{};});
  },

  /* SETTINGS */
  saveSettings:function(s){
    mem.settings=s;
    _whenReady(function(){
      _writeFile('phm.config.json',_rootId,JSON.stringify(s,null,2))
        .catch(function(e){console.warn('[Drive saveSettings]',e);});
    });
    return Promise.resolve();
  },
  loadSettings:function(){
    if(!_driveReady)return Promise.resolve(mem.settings||{});
    return _findFile('phm.config.json',_rootId).then(function(id){
      if(!id)return mem.settings||{};
      return _readText(id).then(function(t){if(t)try{mem.settings=JSON.parse(t);}catch(e){}return mem.settings||{};});
    }).catch(function(e){console.warn('[Drive loadSettings]',e);return mem.settings||{};});
  }
};

/* ===== helpers ===== */
function pad(n){return String(n).padStart(2,'0');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function keyOf(y,m,d){return ''+y+pad(m+1)+pad(d);}
function todayKey(){var n=new Date();return keyOf(n.getFullYear(),n.getMonth(),n.getDate());}
function utc(k){return Date.UTC(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8));}
function daysBetween(a,b){return Math.round((utc(b)-utc(a))/86400000);}
function dayNumber(k){return Math.floor((utc(k)-Date.UTC(1998,0,19))/86400000)+1;}
function fmtLong(k){return new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8)).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function fmtMed(k){return new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8)).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function k2i(k){return k?k.slice(0,4)+'-'+k.slice(4,6)+'-'+k.slice(6,8):'';}
function i2k(v){return v?v.replace(/-/g,''):'';}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function preview50(t){
  /* strip any HTML tags that may be in legacy entries */
  var clean=t.indexOf('<')>=0?_stripHtml(t):t;

/* prediction + punctuation */
function buildModel(ts){var bi={},uni={};ts.forEach(function(t){var w=(t.toLowerCase().match(/[a-z']+/g)||[]);for(var i=0;i<w.length;i++){uni[w[i]]=(uni[w[i]]||0)+1;if(i){var p=w[i-1];(bi[p]=bi[p]||{})[w[i]]=(bi[p][w[i]]||0)+1;}}});return{bi:bi,uni:uni};}
function predict(m,text){var w=(text.toLowerCase().match(/[a-z']+/g)||[]);var last=w[w.length-1];var open=/[\s.,!?\n]$/.test(text)||text==='';
  function top(o){return Object.keys(o||{}).map(function(k){return[k,o[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,3).map(function(x){return x[0];});}
  if(!open&&last){var c={};Object.keys(m.uni).forEach(function(k){if(k.indexOf(last)===0&&k!==last)c[k]=m.uni[k];});return{mode:'complete',words:top(c)};}
  if(open&&last&&m.bi[last])return{mode:'next',words:top(m.bi[last])};return{mode:'next',words:top(m.uni)};}
function tidy(s){return s.replace(/(^|[.!?]\s+|\n\s*)([a-z])/g,function(m,p,c){return p+c.toUpperCase();}).replace(/\bi\b/g,'I').replace(/(\w)'(\w)/g,'$1\u2019$2');}

function timeProgress(p){if(!p.target)return null;var span=daysBetween(p.start,p.target);if(span<=0)return null;var done=daysBetween(p.start,todayKey());return clamp(Math.round(done/span*100),0,100);}

function renderLock(){
  root.innerHTML='';
  var errMsg=h('p',{style:{color:'var(--danger)',fontSize:'13px',margin:'4px 0 0',minHeight:'18px'}},' ');
  var pwInput=h('input',{type:'password',placeholder:'Enter your password',
    style:{width:'100%',background:'var(--surface-3)',border:'1px solid var(--line)',borderRadius:'12px',
      color:'var(--text)',fontSize:'18px',padding:'14px 16px',outline:'none',textAlign:'center',
      fontFamily:'var(--font)',letterSpacing:'2px'}});
  var unlockBtn=h('button',{class:'openj',onclick:tryPw},'Unlock');
  pwInput.addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
  function tryPw(){
    var v=pwInput.value;
    if(v===S.settings.pin){doUnlock();}
    else{errMsg.textContent='Incorrect password — try again';pwInput.value='';pwInput.focus();
      setTimeout(function(){errMsg.textContent=' ';},2000);}
  }
  /* WebAuthn / Touch ID / Face ID */
  function tryBio(){
    if(!window.PublicKeyCredential){errMsg.textContent='Biometrics not available in this browser.';return;}
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(ok){
      if(!ok){errMsg.textContent='No biometric authenticator found.';return;}
      navigator.credentials.get({publicKey:{
        challenge:crypto.getRandomValues(new Uint8Array(32)),
        timeout:60000,
        userVerification:'required',
        allowCredentials:[]
      }}).then(function(){doUnlock();})
      .catch(function(e){
        /* User cancelled or no credential registered — fall through to password */
        if(e.name!=='NotAllowedError')errMsg.textContent='Biometric failed: '+e.message;
      });
    });
  }
  function doUnlock(){
    root.innerHTML='';
    S.locked=false;
    // Load cached data from localStorage before Drive connects
    try { var ci=localStorage.getItem('phm-entry-index'); if(ci){ var pi=JSON.parse(ci); S.entryIndex=pi.index||{}; } } catch(e){}
    try { var cp=localStorage.getItem('phm-projects'); if(cp) mem.projects=JSON.parse(cp); } catch(e){}
    try { var cm=localStorage.getItem('phm-media'); if(cm){ var pm=JSON.parse(cm); mem.media=pm; } } catch(e){}
    /* silently try to reconnect Drive without showing a popup */
    if(typeof google!=='undefined'&&google.accounts&&!_driveReady){
      try{
        if(!_tokenClient) setupGIS();
        if(_tokenClient) _tokenClient.requestAccessToken({prompt:''});
      }catch(e){}
    }
    refresh(); _preloadLocalAudio(); renderShell(); armIdle();
  }
  var hasBio=S.settings.bio&&typeof window.PublicKeyCredential!=='undefined';
  var box=h('div',{class:'lock fade'},
    h('div',{class:'glyph'},ic('book',true)),
    h('div',{style:{textAlign:'center'}},h('h1',{},'Project Hail Mary'),
      h('p',{style:{color:'var(--muted)',fontSize:'14px',margin:'4px 0 0'}},'Your private journal')),
    h('div',{style:{width:'100%',maxWidth:'280px'}},
      pwInput, errMsg, unlockBtn,
      hasBio?h('button',{class:'bio',style:{marginTop:'12px',width:'100%',justifyContent:'center'},onclick:tryBio},
        ic('face'),' Use Touch ID / Face ID'):null));
  root.appendChild(h('div',{class:'shell'},h('div',{class:'main'},box)));
  setTimeout(function(){pwInput.focus();},80);
}

function openEditor(d){
  /* Always fetch the latest version from Drive before opening, to avoid
     writing on a blank page when content already exists on Drive.
     Show a loading indicator; fall back to local cache if Drive is unavailable. */
  var parts=fmtLong(d).split(', ');
  var loadingEl=h('div',{class:'ed fade'},
    h('div',{class:'edtop'},h('button',{class:'icbtn',onclick:function(){loadingEl.remove();}},ic('left')),
      h('div',{class:'d'},parts.slice(0,2).join(', '))),
    h('div',{style:{padding:'40px 24px',textAlign:'center',color:'var(--muted)',fontSize:'14px'}},'Loading…'));
  mainEl.appendChild(loadingEl);

  function _openEditorWithText(text, fromCache){
    loadingEl.remove();
    var rawText=text||'';
    var cleanedText=_cleanEntryText(rawText.indexOf('<')>=0?_stripHtml(rawText):rawText);
    if(cleanedText!==rawText&&cleanedText.trim()){S.entries[d]={text:cleanedText,updatedAt:Date.now()};store.saveEntry(d,cleanedText);}
    var finalText=cleanedText;
    var status='saved',timer=null;
    var model=buildModel(Object.keys(S.entries).map(function(k){return S.entries[k].text;}));
    var saveEl=h('div',{class:'save go'},h('span',{class:'svdot'}),'Synced');
    var metaW=h('span',{},'0 words');
    var cacheNotice=fromCache?h('div',{style:{fontSize:'12px',color:'var(--orange-2)',padding:'4px 0 0'}},'Loaded from local cache — Drive unavailable'):null;
    var ta=h('textarea',{class:'paper',placeholder:'Today…',autocapitalize:'sentences',autocorrect:'off',spellcheck:'false'});ta.value=finalText;
    var sug=h('div',{class:'suggest'});
    function st(s){status=s;saveEl.className='save'+(s==='saved'?' go':'');saveEl.lastChild.textContent=s==='saved'?'Synced':'Saving…';}
    function cw(){var n=(ta.value.trim().match(/\S+/g)||[]).length;metaW.textContent=n+' word'+(n===1?'':'s');}
    function sched(dl){st('saving');clearTimeout(timer);timer=setTimeout(function(){saveEntry(d,ta.value).then(function(){st('saved');});},dl||650);}
    function flush(){clearTimeout(timer);return saveEntry(d,ta.value).then(function(){st('saved');});}
    function ds(){sug.innerHTML='';var p=predict(model,ta.value);p.words.forEach(function(w){sug.appendChild(h('button',{class:'chip',onclick:function(){if(p.mode==='complete')ta.value=ta.value.replace(/[a-z']+$/i,w)+' ';else ta.value=ta.value+(/(\s|^)$/.test(ta.value)?'':' ')+w+' ';ta.focus();cw();ds();sched(400);}},w));});}
    ta.addEventListener('input',function(){cw();ds();sched();});
    var ed=h('div',{class:'ed fade'},h('div',{class:'edtop'},h('button',{class:'icbtn',onclick:function(){flush().then(function(){ed.remove();renderShell();});}},ic('left')),h('div',{class:'d'},parts.slice(0,2).join(', ')),saveEl),
      h('div',{class:'edmeta'},metaW,h('span',{},'Day '+dayNumber(d).toLocaleString())),
      cacheNotice,ta,sug,
      h('div',{class:'edbar'},h('button',{class:'smallbtn t',onclick:function(){ta.value=tidy(ta.value);cw();ds();sched(300);}},'Tidy punctuation'),
        h('button',{class:'smallbtn',onclick:function(){_downloadDocx(d+'.docx',fmtLong(d),ta.value);}},'Export .docx')));
    mainEl.appendChild(ed);cw();ds();ta.focus();
  }

  /* Try to get the Drive file ID for this date from the entry index */
  var fileId=S.entryIndex&&S.entryIndex[d];
  if(typeof fileId!=='string'||fileId==='local') fileId=null;

  if(fileId&&_driveReady){
    /* Fetch latest from Drive, then open editor */
    _readDocxAsText(fileId).then(function(driveText){
      var text=driveText?_cleanEntryText(driveText.trim()):null;
      if(text){
        /* Update local cache with fresh Drive content */
        S.entries[d]={text:text,updatedAt:Date.now()};
        mem['e:'+d]={text:text,ts:Date.now()};
      }
      /* Fall back to local cache if Drive returned nothing */
      var finalText=text||(S.entries[d]?S.entries[d].text:'');
      _openEditorWithText(finalText, !text&&!!S.entries[d]);
    }).catch(function(e){
      console.warn('[openEditor] Drive fetch failed for',d,e);
      _openEditorWithText(S.entries[d]?S.entries[d].text:'', !!S.entries[d]);
    });
  } else {
    /* No Drive connection or no index entry — use local cache immediately */
    _openEditorWithText(S.entries[d]?S.entries[d].text:'', _driveReady&&!!S.entries[d]);
  }
}

/* ===== MEDIA / REAL PLAYER =====
   Uses HTML <audio> element for real playback.
   Streams from Google Drive via authenticated fetch (verified audio/ Content-Type).
   Auto-counts plays after 90%, synced to Drive via phm-media.json.
   ======================================================= */
var PL={trackId:null,loop:true,counted:false,isPlaying:false};
var _audio=null;    /* single shared <audio> element */
var _playPromise=null; /* tracks the pending play() promise to avoid AbortError */
var _blobUrls={}; /* legacy — kept for compat, no longer used for playback */
var _localAudioUrls={}; /* trackId -> objectURL for locally-saved audio */
var _hasLocalAudio={}; /* trackId -> true/false/undefined(unchecked) */
var _syncStatusEl=null,_syncInProgress=false,_lastSyncTime=null;

/* IndexedDB for persisting audio blobs across sessions */
var _idb=null;
function _openIDB(){
  if(_idb) return Promise.resolve(_idb);
  return new Promise(function(res,rej){
    var req=indexedDB.open('phm-audio',1);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore('blobs');};
    req.onsuccess=function(e){_idb=e.target.result;res(_idb);};
    req.onerror=function(){rej(req.error);};
  });
}
function _saveAudioBlob(trackId,blob){
  return _openIDB().then(function(db){
    return new Promise(function(res){
      var tx=db.transaction('blobs','readwrite');
      tx.objectStore('blobs').put(blob,trackId);
      tx.oncomplete=res; tx.onerror=res;
    });
  }).catch(function(e){console.warn('[IDB save]',e);});
}
function _loadAudioBlob(trackId){
  return _openIDB().then(function(db){
    return new Promise(function(res){
      var req=db.transaction('blobs').objectStore('blobs').get(trackId);
      req.onsuccess=function(){res(req.result||null);};
      req.onerror=function(){res(null);};
    });
  }).catch(function(){return null;});
}
/* Local-first audio: each device stores audio in IDB under 'phm-local-audio-{trackId}' */
function _saveLocalAudio(trackId,blob){
  return _openIDB().then(function(db){
    return new Promise(function(res){
      var tx=db.transaction('blobs','readwrite');
      tx.objectStore('blobs').put(blob,'phm-local-audio-'+trackId);
      tx.oncomplete=res; tx.onerror=res;
    });
  }).catch(function(e){console.warn('[IDB saveLocal]',e);});
}
function _loadLocalAudio(trackId){
  return _openIDB().then(function(db){
    return new Promise(function(res){
      var req=db.transaction('blobs').objectStore('blobs').get('phm-local-audio-'+trackId);
      req.onsuccess=function(){res(req.result||null);};
      req.onerror=function(){res(null);};
    });
  }).catch(function(){return null;});
}
function _removeLocalAudio(trackId){
  return _openIDB().then(function(db){
    return new Promise(function(res){
      var tx=db.transaction('blobs','readwrite');
      tx.objectStore('blobs').delete('phm-local-audio-'+trackId);
      tx.oncomplete=res; tx.onerror=res;
    });
  }).catch(function(e){console.warn('[IDB removeLocal]',e);});
}


function _getAudio(){
  if(!_audio){
    _audio=document.createElement('audio');
    _audio.addEventListener('timeupdate',_onTimeUpdate);
    _audio.addEventListener('ended',_onEnded);
    _audio.addEventListener('loadedmetadata',function(){
      var t=S.tracks[PL.trackId];
      if(t&&_audio.duration&&isFinite(_audio.duration)){
        t.duration=Math.round(_audio.duration);
        saveTrack(t);
        refreshPlayerUI();
      }
    });
  }
  return _audio;
}
/* Safe play: stores the play() promise so pause() can wait for it before firing,
   preventing the AbortError that occurs when pause() interrupts an in-flight play(). */
function _safePlay(a){
  if(!a) return;
  PL.isPlaying=true;
  _playPromise=a.play();
  if(_playPromise){
    _playPromise.then(function(){_playPromise=null;}).catch(function(e){
      _playPromise=null;
      if(e&&e.name!=='AbortError') console.warn('[audio play]',e);
    });
  }
}
/* Safe pause: if a play() is still resolving, waits for it before pausing. */
function _safePause(a){
  if(!a) return;
  PL.isPlaying=false;
  if(_playPromise){
    _playPromise.then(function(){a.pause();_playPromise=null;}).catch(function(){_playPromise=null;});
  } else {
    a.pause();
  }
}

function _onTimeUpdate(){
  var a=_audio; if(!a||!PL.trackId)return;
  var t=S.tracks[PL.trackId]; if(!t)return;
  if(a.duration&&isFinite(a.duration)&&!PL.counted&&a.currentTime/a.duration>=0.9){
    PL.counted=true;
    _incrementPlayCount(PL.trackId);
  }
  refreshPlayerUI();
}
function _onEnded(){
  if(PL.loop){PL.counted=false;if(_audio)_safePlay(_audio);}
  else{refreshPlayerUI();}
}
function stopPlayer(){
  if(_audio){_safePause(_audio);}
  PL.counted=false;
}
/* Returns promise of the media Drive folder ID (cached via _ensureFolder). */
function _getMediaFolderId(){
  if(!_driveReady||!_rootId) return Promise.resolve(null);
  return _ensureFolder('media',_rootId);
}

/* Additive play count sync: each device pushes only its new plays since last sync. */
function _syncPlayCount(trackId){
  if(!_driveReady||_syncInProgress) return;
  var localKey='phm-local-count-'+trackId;
  var syncedKey='phm-synced-count-'+trackId;
  var localCount=parseInt(localStorage.getItem(localKey)||'0',10);
  var syncedCount=parseInt(localStorage.getItem(syncedKey)||'0',10);
  var newPlays=localCount-syncedCount;
  if(newPlays<=0) return;
  _syncInProgress=true;
  if(_syncStatusEl){_syncStatusEl.textContent='↻';_syncStatusEl.title='Syncing play count…';}
  _getMediaFolderId().then(function(mid){
    if(!mid){_syncInProgress=false;if(_syncStatusEl)_syncStatusEl.textContent='';return;}
    return _findFile('phm-media.json',mid).then(function(fid){
      function _writeCounts(data){
        if(!data.counts) data.counts={};
        var remoteTotal=data.counts[trackId]||0;
        var newTotal=remoteTotal+newPlays;
        data.counts[trackId]=newTotal;
        if(S.tracks[trackId]) S.tracks[trackId].autoCount=Math.max(S.tracks[trackId].autoCount||0,newTotal);
        data.tracks=S.tracks; data.counters=S.counters;
        mem.media=data;
        try{localStorage.setItem('phm-media',JSON.stringify(data));}catch(e){}
        return _writeFile('phm-media.json',mid,JSON.stringify(data,null,2)).then(function(){
          localStorage.setItem(syncedKey,String(localCount));
          _syncInProgress=false; _lastSyncTime=Date.now();
          refreshPlayerUI();
          if(_syncStatusEl){
            _syncStatusEl.textContent='✓'; _syncStatusEl.title='Synced';
            setTimeout(function(){if(_syncStatusEl)_syncStatusEl.textContent='';},3000);
          }
        });
      }
      if(!fid) return _writeCounts({tracks:S.tracks,counters:S.counters,counts:{}});
      return _readText(fid).then(function(txt){
        var data={}; try{data=JSON.parse(txt)||{};}catch(e){}
        return _writeCounts(data);
      });
    });
  }).catch(function(e){
    console.warn('[_syncPlayCount]',e);
    _syncInProgress=false;
    if(_syncStatusEl) _syncStatusEl.textContent='';
  });
}

/* Increment this device's local play count and push the delta to Drive. */
function _incrementPlayCount(trackId){
  var t=S.tracks[trackId]; if(!t) return;
  var localKey='phm-local-count-'+trackId;
  var localCount=(parseInt(localStorage.getItem(localKey)||'0',10))+1;
  localStorage.setItem(localKey,String(localCount));
  t.autoCount=Math.max(t.autoCount||0,localCount);
  refreshPlayerUI();
  _syncPlayCount(trackId);
}

/* Pull merged play counts from Drive (other devices' additions). */
function _syncMediaCounts(){
  if(!_driveReady||!_rootId) return;
  _getMediaFolderId().then(function(mid){
    if(!mid) return;
    return _findFile('phm-media.json',mid).then(function(fid){
      if(!fid) return;
      return _readText(fid).then(function(txt){
        if(!txt) return;
        var data; try{data=JSON.parse(txt);}catch(e){return;}
        var cnts=(data&&data.counts)||{};
        var changed=false;
        Object.keys(S.tracks).forEach(function(id){
          if(cnts[id]!==undefined){
            var localKey='phm-local-count-'+id;
            var localCount=parseInt(localStorage.getItem(localKey)||'0',10);
            var display=Math.max(cnts[id],S.tracks[id].autoCount||0,localCount);
            if(display!==(S.tracks[id].autoCount||0)){S.tracks[id].autoCount=display;changed=true;}
          }
        });
        if(changed){refresh();if(!S.locked)refreshPlayerUI();}
      });
    });
  }).catch(function(e){console.warn('[_syncMediaCounts]',e);});
}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&!S.locked&&_driveReady) _syncMediaCounts();
});

/* Pre-check IDB for all known tracks so renderMedia shows correct state immediately. */
function _preloadLocalAudio(){
  if(!S||!S.tracks) return;
  Object.keys(S.tracks).forEach(function(id){
    if(_hasLocalAudio[id]!==undefined) return;
    _loadLocalAudio(id).then(function(blob){
      if(blob){
        if(!_localAudioUrls[id]) _localAudioUrls[id]=URL.createObjectURL(blob);
        _hasLocalAudio[id]=true;
        if(id===PL.trackId&&_audio&&(!_audio.src||_audio.src===window.location.href)){
          _audio.src=_localAudioUrls[id]; refreshPlayerUI();
        }
      } else {
        _hasLocalAudio[id]=false;
      }
    });
  });
}
function loadTrack(trackId, autoPlay){
  var t=S.tracks[trackId]; if(!t)return;
  PL.trackId=trackId; PL.counted=false;
  var a=_getAudio();
  a.pause(); a.src=''; a.load();
  /* check in-memory objectURL (already loaded this session) */
  if(_localAudioUrls[trackId]){
    a.src=_localAudioUrls[trackId];
    if(autoPlay) _safePlay(a);
    refreshPlayerUI(); return;
  }
  /* load from IndexedDB (saved on this device) */
  _loadLocalAudio(trackId).then(function(blob){
    if(PL.trackId!==trackId) return;
    if(blob){
      var url=URL.createObjectURL(blob);
      _localAudioUrls[trackId]=url; _hasLocalAudio[trackId]=true;
      a.src=url;
      if(autoPlay) _safePlay(a);
      refreshPlayerUI();
    } else {
      _hasLocalAudio[trackId]=false;
      if(_playerStatusEl){
        _playerStatusEl.textContent='No audio saved on this device — tap “Load audio file” below to add it.';
        setTimeout(function(){if(_playerStatusEl)_playerStatusEl.textContent='';},9000);
      }
      refreshPlayerUI();
    }
  });
}
function togglePlay(){
  var a=_getAudio();
  if(!PL.trackId){var ids=Object.keys(S.tracks);if(ids.length)loadTrack(ids[0],true);return;}
  /* If no real src is loaded yet, delegate to loadTrack which fetches and plays */
  var src=a.src||'';
  if(!src||src===window.location.href||(!src.startsWith('blob:')&&!src.startsWith('https:'))){
    loadTrack(PL.trackId,true);return;
  }
  if(a.paused){_safePlay(a);}
  else{_safePause(a);}
  refreshPlayerUI();
}
function selectTrack(id){
  if(id===PL.trackId&&_audio&&!_audio.paused){_safePause(_audio);refreshPlayerUI();return;}
  loadTrack(id,true);
  renderShell();
}
function switchTrack(dir){
  var ids=Object.keys(S.tracks);if(!ids.length)return;
  var i=ids.indexOf(PL.trackId);i=(i+dir+ids.length)%ids.length;
  loadTrack(ids[i],true);renderShell();
}
function addCounter(){
  var name=prompt('Counter name (e.g. Rosary, Push-ups):');
  if(name&&name.trim()){var id=uid('c');var rec={id:id,name:name.trim(),count:0};saveCounter(rec);renderShell();}
}

var _playerBar=null,_playerTime=null,_bigCount=null,_playBtn=null,_playerStatusEl=null,_syncStatusEl=null,_countEls={};
function refreshPlayerUI(){
